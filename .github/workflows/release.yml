---
name: Release
run-name: "Release (${{ inputs.bump }})"

# Promotes development -> main, tags the release (no `v` prefix), force-moves the floating major
# tag, and publishes a GitHub Release. Family-wide scheme (see fireball_orchestrator's
# versioning.instructions.md): the VERSION patch is bumped per merge to development (version.yml),
# NOT here — a release just promotes + tags whatever development is at. The `bump` input forces a
# minor/major milestone on development first (default: none; `major` = the official 1.0.0 launch).
# Consumers pin `@1` (floating major on main; `@0` during pre-1.0) or `@development` (dev channel).
# `invoke ai_toolkit.release` = `gh workflow run release.yml`.
#
# Auth: main + development are PR-required branches (public repo). The org-wide
# fireball-actions-bot App (vars.BOT_APP_ID + secrets.BOT_PRIVATE_KEY) is the bypass actor.
#
# PyPI publishing (the `pypi` job) is gated on the repo variable `PYPI_ENABLED`. To turn it on:
# set `PYPI_ENABLED=true`, add a PyPI Trusted Publisher for this repo + `release.yml` + the
# `pypi` environment (no API token needed). Until then, `main` tags publish only a GitHub Release.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Milestone bump on development before promoting (default: none)"
        type: choice
        default: none
        options:
          - none
          - patch
          - minor
          - major

jobs:
  # 🔢 Bump VERSION for the release
  version:
    runs-on: ubuntu-latest
    concurrency: version-bump-development
    permissions:
      contents: read
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Check Out Code
        uses: actions/checkout@v7
        with:
          ref: development
          token: ${{ steps.bot-token.outputs.token }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"

      - name: Install Dependencies
        run: uv sync

      - name: Resolve VERSION (${{ inputs.bump }})
        id: bump
        run: |
          # Commit as the repo owner, not github-actions[bot] — these automated release
          # commits shouldn't add a bot to the contributor list (the App token still pushes).
          git config user.name "Levon Becker"
          git config user.email "LevonBecker@users.noreply.github.com"
          if [ "${{ inputs.bump }}" != "none" ]; then
            uv run --no-sync invoke "ver.project_bump_${{ inputs.bump }}"
          fi
          new_version="$(cat VERSION)"
          # Never reuse a tag — advance the patch until the candidate is free.
          while git ls-remote --exit-code --tags origin "refs/tags/$new_version" >/dev/null 2>&1; do
            major="$(cut -d. -f1 <<<"$new_version")"
            minor="$(cut -d. -f2 <<<"$new_version")"
            patch="$(( $(cut -d. -f3 <<<"$new_version") + 1 ))"
            new_version="$major.$minor.$patch"
          done
          echo "$new_version" > VERSION
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          git add VERSION
          if git diff --cached --quiet; then
            echo "VERSION unchanged at $new_version — promoting as-is"
          else
            git commit -m "chore: bump VERSION to $new_version [skip ci]"
            git push origin HEAD:development
          fi

      - name: Report version
        run: echo "### Releasing ${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

  # 🔀 Promote development -> main
  promote:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Check Out Code
        uses: actions/checkout@v7
        with:
          ref: development
          fetch-depth: 0  # full history so main/development share a discoverable common ancestor
          token: ${{ steps.bot-token.outputs.token }}

      - name: Merge development to main
        run: |
          git config user.name "Levon Becker"
          git config user.email "LevonBecker@users.noreply.github.com"
          git fetch origin main
          git checkout main
          # -X theirs: development is the source of truth; on conflict its side wins
          git merge origin/development --no-ff -X theirs \
            -m "chore: release ${{ needs.version.outputs.version }} to main"
          git push origin main

  # 🏷️ Tag the release + move the floating major tag
  tag:
    needs: [version, promote]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Check Out Code
        uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.bot-token.outputs.token }}

      - name: Tag ${{ needs.version.outputs.version }} and move the major tag
        run: |
          version="${{ needs.version.outputs.version }}"
          major="${version%%.*}"
          git config user.name "Levon Becker"
          git config user.email "LevonBecker@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo "Tag $version already exists — skipping" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git tag "$version"
          git tag -f "$major"
          git push origin "$version"
          git push -f origin "$major"
          echo "### Tagged $version (floating major: $major)" >> "$GITHUB_STEP_SUMMARY"

  # 📦 Create the GitHub Release
  publish_release:
    needs: [version, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creating a Release needs write; the repo default GITHUB_TOKEN is read-only
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Create GitHub Release
        run: >-
          gh release create "${{ needs.version.outputs.version }}"
          --target main
          --title "${{ needs.version.outputs.version }}"
          --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 🐍 Publish to PyPI — gated on repo variable PYPI_ENABLED. Trusted Publishing (OIDC), no token.
  pypi:
    needs: [version, tag]
    if: ${{ vars.PYPI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Check Out Code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup uv
        uses: astral-sh/setup-uv@v8.3.2
        with:
          python-version: "3.14"

      - name: Build sdist + wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
