# Dependabot version updates (Owner rule 2026-11-17): a release is only proposed once it has aged.
#   minor and patch: at least 48 hours (2 days) old
#   major:           at least 1 month (30 days) old
# Security updates are not delayed by the cooldown (GitHub applies cooldown to version updates only).
# PRs target `development` (the default branch), grouped so one PR carries the minor/patch bumps per ecosystem.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 2
      semver-patch-days: 2
      semver-minor-days: 2
      semver-major-days: 30
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "development"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 2
      semver-patch-days: 2
      semver-minor-days: 2
      semver-major-days: 30
    groups:
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    labels: ["dependencies"]
