[project]
name = "fireball_ai_toolkit"
dynamic = ["version"]  # read from the VERSION file (see [tool.setuptools.dynamic])
description = "Single source of truth for Fireball's shared AI-agent tooling: canonical slash commands, agent instructions, and skills, plus the generator that renders them into every AI tool's native format."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Levon Becker" }]
keywords = ["ai", "agents", "claude", "copilot", "slash-commands", "codegen", "devtools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Code Generators",
  "Topic :: Software Development :: Build Tools",
]
requires-python = ">=3.14"
dependencies = [
    "invoke~=3.0.3",
    "pyyaml~=6.0.3",
]

[dependency-groups]
dev = [
    "actionlint-py~=1.7.12.24",
    "pylint~=4.0.6",
    "pytest~=9.1.1",
    "pytest-cov~=7.1.0",
    "ruff~=0.16.0",
    "twine~=6.2.0",
    "yamllint~=1.38.0",
]

[project.scripts]
ai-toolkit = "fireball_ai_toolkit.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
# Only the distributable package ships. `modules/` (common/setup/versioning) and `tasks/` are
# repo-local dev tooling and are deliberately excluded from the wheel + sdist.
include = ["fireball_ai_toolkit*"]

[tool.setuptools.package-data]
# The canonical content trees live inside the package so they ship in the wheel and
# `ai-toolkit download` can clobber a consuming repo's _shared/ straight from the install.
fireball_ai_toolkit = ["content/**/*", "py.typed"]

[project.urls]
homepage = "https://github.com/fireballenterprise/fireball_ai_toolkit"
repository = "https://github.com/fireballenterprise/fireball_ai_toolkit"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["tests/*"]

[tool.ruff.lint]
select = ["PL", "E", "W", "F", "I", "B", "A", "C4", "N", "UP", "T10", "EXE", "COM819", "C", "Q"]

ignore = ["E501", "PLR2004"]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 20 # 5 = default, 12 = previous

[tool.ruff.lint.pylint]
max-branches = 20 # default = 12, previous = 15
max-args = 15 # default = 5
max-statements = 75 # default = 50
max-returns = 10 # default = 6
max-nested-blocks = 10 # default = 5

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["tmp", ".venv", ".ruff_cache", "__pycache__"]
markers = [
    "setup: modules/setup/ (properties.yml bootstrap) — tests/setup/",
    "style: Markdown/doc style checks — tests/style/",
    "ai_toolkit: fireball_ai_toolkit/ (catalog parse + render) — tests/ai_toolkit/",
]

[tool.pylint.main]
py-version = "3.14"
fail-under = 10
ignore = ["CVS"]
ignore-paths = [
  "^env/.*$",
  "^.venv/.*$",
  "^venv/.*$",
  "^.ruff_cache/.*$",
  "^tmp/.*$",
  ".*__pycache__.*$",
  "^tests/.*$",
]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = ["all"]
enable = ["no-member"]

[tool.pylint.design]
max-args = 15
max-branches = 20
max-locals = 20
max-positional-arguments = 15
max-public-methods = 20
max-returns = 10
max-statements = 75

[tool.pylint.refactoring]
max-nested-blocks = 10
